appId: ai.syllora.desktop
productName: Syllora
copyright: Copyright © 2026 Syllora authors

directories:
  output: dist
  buildResources: build

# Host 依赖闭包（node_modules 顶层目录被 createFilter 硬编码剪枝，无法经
# extraResources 落盘）——由 afterPack 钩子直接拷入，见 scripts/after-pack.cjs。
afterPack: scripts/after-pack.cjs

# 主程序只打包壳自身代码；host/web 资源走 extraResources（原样落盘，
# 不进 asar —— 原生 .node 与运行时读取都更稳，R4）。
files:
  - src/**/*
  - package.json
extraResources:
  - from: resources/host
    to: host
    filter: ["**/*"]
  - from: resources/web
    to: web
    filter: ["**/*"]
  # 示例课程：宿主首启时复制进课程目录（apps/cli/src/demo-seed.ts）；目录缺失时构建会报错，
  # assemble-host.mjs 按存在与否决定是否拷入（洁版克隆可删掉本节与 sample-courses/）。
  - from: resources/sample-courses
    to: sample-courses
    filter: ["**/*"]
asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  include: scripts/preserve-courses.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false

mac:
  target:
    # zip 是 generic provider 自动更新的载荷（latest-mac.yml 引用它），dmg 是人
    # 下载的安装镜像——两者都要出。
    - target: zip
      arch: [arm64, x64]
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.education
  artifactName: ${productName}-${version}-${arch}.${ext}
  # 签名/公证见 plan 4.4；无证书时保持 identity: null 可出未签名包
  identity: null
  hardenedRuntime: true
dmg:
  title: ${productName}-${version}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Education
  # scope 包名（@syllora/desktop）默认派生出含 @ 的 executableName 与
  # dist/@syllora/ 产物目录——AppImage 路径安全检查会拒绝前者，fpm（deb）
  # 会因父目录不存在炸掉后者。显式指定合法名与扁平产物名。
  executableName: syllora
  artifactName: ${productName}-${version}-${arch}.${ext}

# 自动更新元数据（latest*.yml 的 url 指向 GitHub Release 的 latest 下载地址；
# Release 由 .github/workflows/release.yml 在 tag 推送时产出）。
publish:
  provider: generic
  url: https://github.com/Favio8/Syllora/releases/latest/download/
